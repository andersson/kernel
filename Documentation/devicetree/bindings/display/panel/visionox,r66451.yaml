%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/visionox,r66451.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Visionox R66451 panel.

maintainers:
  - Robert Foss <robert.foss@linaro.org>

description: |
  This binding is for display panels using a Visionox R66451 panel.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: visionox,r66451

  port: true
  power-supply: false
  reset-gpios: true

additionalProperties: false

required:
  - compatible
  - port
  - reset-gpios

examples:
  - |
    panel {
        compatible = "visionox,r66451";

        reset-gpios = <&tlmm 24 0>;
        port {
            panel0_in: endpoint {
                remote-endpoint = <&dsi0_out>;
            };
        };
    };
...
